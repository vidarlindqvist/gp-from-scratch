[project]
name = "gp-from-scratch"
version = "0.1.0"
description = "Gaussian Process Regression implemented from scratch"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
